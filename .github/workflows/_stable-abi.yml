# Owner(s): ["module: ci"]
name: stable-abi

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Shadow rollout: preserve failures and reports without gating the PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install libabigail
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y abigail-tools
          test "$(abidw --version)" = 'abidw: 2.4.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stable-abi-libraries
          path: abi-libraries
      - name: Snapshot stable ABI
        run: python tools/abi/check_abi.py snapshot --build abi-libraries --output abi-current --configuration linux-x86_64-cuda13.2-clang20-dwarf4
      - name: Publish main baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-abi-${{ github.sha }}
          path: abi-current
          if-no-files-found: error
          retention-days: 90
      - name: Fetch ancestor baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            BASE=$(git merge-base HEAD "$BASE_SHA")
          else
            BASE=$(git rev-parse HEAD^)
          fi
          python tools/abi/fetch_baseline.py --repo "$GH_REPO" --ref "$BASE" --output abi-baseline
      - name: Compare stable ABI
        run: python tools/abi/check_abi.py compare --baseline abi-baseline --current abi-current --report abi-report.md
      - name: Write job summary
        if: always()
        run: |
          if [ ! -f abi-report.md ]; then
            printf '# Torch stable ABI report\n\nInfrastructure failure: inspect the failed step above. No compatibility result is available.\n' > abi-report.md
          fi
          cat abi-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ABI report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-abi-report
          path: |
            abi-report.md
            abi-current
          retention-days: 14
